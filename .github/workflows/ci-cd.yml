name: CI/CD

# Run manually from GitHub Actions; deploys to Vercel via the Vercel CLI.
#   select branch `production` -> Vercel production deployment
#   select any other branch   -> Vercel preview deployment
#
# Required repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
        env:
          VITE_IS_PRODUCTION: "true"

  deploy:
    name: Deploy to Vercel (${{ github.ref == 'refs/heads/production' && github.event_name != 'pull_request' && 'production' || 'preview' }})
    needs: ci
    runs-on: ubuntu-latest
    # Secrets are not available to PRs from forks; skip deploying those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.ref == 'refs/heads/production' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.ref == 'refs/heads/production' && github.event_name != 'pull_request' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls project settings and the environment variables configured in Vercel
      # (VITE_IS_PRODUCTION, VITE_WEB_NAME, VITE_MAPBOX_TOKEN), which override the committed .env.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $VERCEL_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Preview deployment:** ${process.env.DEPLOY_URL}\n\nCommit: ${context.payload.pull_request.head.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
