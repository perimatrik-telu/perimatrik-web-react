<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4d2f" />
    <title>Offline | PERIMATRIK</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe3;
        --card: #fffaf0;
        --text: #183120;
        --muted: #5a6b5f;
        --accent: #1d4d2f;
        --border: rgba(29, 77, 47, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, rgba(230, 120, 23, 0.18), transparent 32%),
          linear-gradient(180deg, #f8f3e9 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(100%, 560px);
        background: color-mix(in srgb, var(--card) 88%, white);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 50px rgba(24, 49, 32, 0.08);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }

      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="PERIMATRIK" />
      <h1>Kamu sedang offline</h1>
      <p>Halaman ini belum bisa dimuat tanpa koneksi. Coba lagi setelah internet kembali tersedia.</p>
      <a href="/">Kembali ke Beranda</a>
    </main>
  </body>
</html>
